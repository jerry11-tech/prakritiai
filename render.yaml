services:
  - type: web
    name: prakritiai
    runtime: static
    repo: https://github.com/jerry11-tech/prakritiai
    branch: main
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @caffeine/template-frontend build
    staticPublishPath: ./src/frontend/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
